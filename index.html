<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Path – Student Portal</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--mu:#6c6c70;--ac:#0a64d6;--ok:#1f8f4e;--warn:#b25e00;--bad:#c4302b;--line:#e0e0e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mu:#a1a1a6;--ac:#4da3ff;--ok:#43c47a;--warn:#ffb347;--bad:#ff6b66;--line:#38383a}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mu:#a1a1a6;--ac:#4da3ff;--ok:#43c47a;--warn:#ffb347;--bad:#ff6b66;--line:#38383a}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:19px;margin:20px 0 8px}h3{font-size:16px;margin:0 0 4px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:transparent;color:var(--ac);border:1px solid var(--line)}button.d{background:transparent;color:var(--bad);border:1px solid var(--line)}
button:disabled{opacity:.45}
input,select,textarea{font:inherit;width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin:3px 0 8px}
input[type=checkbox],input[type=radio]{width:auto;margin:0 8px 0 0}
label{font-size:14px;color:var(--mu)}label.c{display:flex;align-items:center;color:var(--tx);font-size:16px;padding:6px 0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.b{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid var(--line)}
.ok{color:var(--ok)}.wn{color:var(--warn)}.bd{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:9px 0 7px;color:var(--mu);text-decoration:none;font-size:12px;font-weight:600}
nav a b{display:block;font-size:20px}nav a.on{color:var(--ac)}
.lk{opacity:.55}.opt{padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin:5px 0}
.hl{background:rgba(10,100,214,.1);border-radius:10px;padding:8px 10px;margin:8px 0}
a{color:var(--ac)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
"use strict";
const K="aipath.v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayStr=()=>new Date().toLocaleDateString("en-CA");
const STATUS=["Not announced","Upcoming","Applications open","Closing soon","Applications closed","Entry test scheduled","Merit list announced","Admissions completed"];
const CONF=["Awaiting confirmation","Estimated / historical","Officially confirmed"];
const DOCS=["Matric certificate","Intermediate certificate / DMC","CNIC or B-Form","Photograph","Domicile","Father’s CNIC (if required)","Entry test registration","Application fee receipt"];
const UNIS=[["nust","NUST","Islamabad","https://nust.edu.pk"],["fast","FAST-NUCES","Multiple campuses","https://nu.edu.pk"],["comsats","COMSATS University","Islamabad + campuses","https://comsats.edu.pk"],["air","Air University","Islamabad","https://au.edu.pk"],["pieas","PIEAS","Islamabad","https://pieas.edu.pk"],["uetp","UET Peshawar","Peshawar","https://uetpeshawar.edu.pk"],["uop","University of Peshawar","Peshawar","https://uop.edu.pk"],["shu","Salim Habib University","Karachi","https://shu.edu.pk"],["habib","Habib University","Karachi","https://habib.edu.pk"],["lums","LUMS","Lahore","https://lums.edu.pk"],["iba","IBA Karachi","Karachi","https://iba.edu.pk"],["umt","UMT","Lahore","https://umt.edu.pk"],["ucp","UCP","Lahore","https://ucp.edu.pk"],["giki","GIKI","Topi, Swabi","https://giki.edu.pk"],["bahria","Bahria University","Multiple campuses","https://bahria.edu.pk"],["ned","NED University","Karachi","https://neduet.edu.pk"],["ist","IST","Islamabad","https://ist.edu.pk"]].map(u=>({id:u[0],name:u[1],city:u[2],site:u[3]}));
const LESSONS=[
{id:"m1",t:"Understanding numbers",why:"Every maths topic, and every line of code, is built on numbers.",s:"A number tells us how many, or which position. Only ten symbols, called digits (0 to 9), build every number, just like 26 letters build every word.",k:"Numbers are labels for “how many”. 3 apples and 3 cats share the same label: 3.",r:"Your phone shows 5 apps open. The 5 tells you how many.",w:"How many digits are in 4,205? Step 1: write the digits: 4, 2, 0, 5. Step 2: count them: 4 digits.",q:[["Which of these is a single digit?",["7","12","100","25"],0,"Digits are only 0 to 9."],["How many digits are in 4205?",["3","4","5","2"],1,"Digits: 4, 2, 0, 5."],["What is the smallest digit?",["1","9","0","10"],2,"0 is the smallest digit."]]},
{id:"m2",t:"Place value",why:"Place value explains why 305 and 35 are very different, and it is the base of column addition and binary later.",s:"Each digit has a value that depends on its place. In 3,482: 3 thousands, 4 hundreds, 8 tens, 2 ones.",k:"Think of coins: 3 big coins worth 1000, 4 worth 100, 8 worth 10 and 2 worth 1.",r:"Rs 250 is two notes of 100 and one note of 50. Each note sits in a different place value.",w:"Value of 7 in 5,720? 7 is in the hundreds place, so 7 × 100 = 700.",q:[["What is the value of 7 in 5,720?",["7","70","700","7000"],2,"7 is in the hundreds place."],["Which digit is in the tens place of 936?",["9","3","6","0"],1,"936: 9 hundreds, 3 tens, 6 ones."],["2000 + 300 + 5 = ?",["2305","2350","235","2035"],0,"Write each part in its place: 2305."]]},
{id:"m3",t:"Even and odd numbers",why:"Even/odd checks are used in quick maths tricks, patterns and programming (the % operator).",s:"Even numbers split into two equal groups. They end in 0, 2, 4, 6 or 8. Odd numbers always leave one extra.",k:"If you can share sweets equally between 2 friends with none left, the number is even.",r:"Shoes come in pairs, so a count of shoes is even if none is missing a partner.",w:"Is 63 even or odd? Look at the last digit: 3. Not in 0,2,4,6,8, so 63 is odd.",q:[["Which number is even?",["17","24","35","49"],1,"24 ends in 4."],["Which number is odd?",["12","40","63","88"],2,"63 ends in 3."],["Even + even is always…",["odd","even","zero","it depends"],1,"2 + 4 = 6, 10 + 8 = 18: always even."]]},
{id:"m4",t:"Positive and negative numbers",why:"Temperatures, money owed, directions in robotics and coordinates all use negative numbers.",s:"On a number line, numbers to the right of 0 are positive and to the left are negative. Further left means smaller.",k:"Zero is ground floor. Floors above are positive, basement floors are negative.",r:"−3°C means 3 degrees below freezing.",w:"3 − 7: start at 3 and move 7 steps left on the number line. You land on −4.",q:[["Which is smaller: −5 or −2?",["−5","−2","they are equal","0"],0,"−5 is further left."],["3 − 7 = ?",["4","−4","−10","10"],1,"Move 7 left from 3 to reach −4."],["It is −3°C and warms up by 5°C. New temperature?",["2°C","−8°C","8°C","−2°C"],0,"−3 + 5 = 2."]]},
{id:"m5",t:"Addition and subtraction",why:"All other arithmetic is built from these two operations.",s:"Line up digits by place value. Add or subtract from the ones column, carrying or borrowing when needed.",k:"Carrying: when ten ones pile up, swap them for one ten.",r:"Shop bill: Rs 250 + Rs 175 = Rs 425.",w:"47 + 38: ones 7 + 8 = 15, write 5 carry 1. Tens 4 + 3 + 1 = 8. Answer 85.",q:[["47 + 38 = ?",["75","85","95","84"],1,"7+8=15 carry 1; 4+3+1=8."],["100 − 36 = ?",["74","64","66","54"],1,"100 − 36 = 64."],["250 + 175 = ?",["415","425","435","325"],1,"250 + 175: 200 + 100 = 300, then 50 + 75 = 125, so 425."]]}];
const MATH_LATER=["Level 1 (rest): multiplication, division, tables, BODMAS, factors, multiples, primes, HCF, LCM","Level 2: fractions, decimals, percentages, ratios","Level 3: pre-algebra","Level 4: algebra","Level 5: geometry","Level 6: trigonometry","Level 7: intermediate mathematics","Level 8: university maths for AI","Level 9: maths for robotics"];
const TRACKS={prog:{n:"Programming",i:"💻",st:["Stage 1: Computer fundamentals","Stage 2: Python (installing, variables, loops, functions, OOP, Git)","Stage 3: Beginner projects","Stage 4: C++"],res:[["freeCodeCamp","https://www.freecodecamp.org/","Free, English, beginner"],["CS50","https://cs50.harvard.edu/x/","Free, English, beginner–intermediate"],["Python tutorial (official)","https://docs.python.org/3/tutorial/","Free, English, beginner"]]},
cs:{n:"Computer Science",i:"🧠",st:["Architecture and operating systems","Binary, logic gates, Boolean algebra","Data structures and algorithms","Databases and SQL","Networks and security basics"],res:[["CS50","https://cs50.harvard.edu/x/","Free, English"],["MIT OpenCourseWare","https://ocw.mit.edu/","Free, English, university level"]]},
ai:{n:"AI and Machine Learning",i:"🤖",st:["Stage 1: AI foundations","Stage 2: Maths for AI","Stage 3: Python for AI (NumPy, Pandas)","Stage 4: Machine learning","Stage 5: Deep learning","Stage 6: Advanced AI"],res:[["NumPy documentation","https://numpy.org/doc/","Free, English"],["PyTorch documentation","https://pytorch.org/docs/stable/index.html","Free, English, advanced"]]},
rob:{n:"Robotics",i:"⚙️",st:["Stage 1: Robotics fundamentals","Stage 2: Electronics","Stage 3: Arduino","Stage 4: ESP32 and Raspberry Pi","Stage 5: Advanced robotics (kinematics, PID, ROS 2)","Stage 6: Projects"],res:[["Arduino documentation","https://docs.arduino.cc/","Free, English"],["ROS documentation","https://docs.ros.org/","Free, English, advanced"]]}};
const MATHRES=[["Khan Academy – Math","https://www.khanacademy.org/math","Free, English (many languages), all levels"]];

let S=load(),V={tab:"home",lesson:null,uni:null,q:null,res:null};
function load(){const d={done:{},mins:0,days:[],unis:{},custom:[],chk:{},p:{daily:60,degree:"BS Artificial Intelligence",year:"",test:"",mlevel:"Beginner",plevel:"Beginner",goals:""},theme:"auto"};try{const r=JSON.parse(localStorage.getItem(K));return r?Object.assign(d,r):d}catch(e){return d}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function applyTheme(){const r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme)}
const allUnis=()=>UNIS.concat(S.custom);
const U=id=>S.unis[id]||(S.unis[id]={status:0,conf:0,open:"",close:"",test:"",merit:"",fee:"",verified:"",src:"",appNo:"",appFee:"",notes:"",interest:false,prio:false,applied:false,docs:{},extra:[]});
function mark(){const t=todayStr();if(!S.days.includes(t))S.days.push(t)}
function streak(){let n=0,d=new Date();if(!S.days.includes(d.toLocaleDateString("en-CA")))d.setDate(d.getDate()-1);while(S.days.includes(d.toLocaleDateString("en-CA"))){n++;d.setDate(d.getDate()-1)}return n}
const doneCount=()=>LESSONS.filter(l=>S.done[l.id]).length;
const nextLesson=()=>LESSONS.find(l=>!S.done[l.id]);
const unlocked=i=>i===0||!!S.done[LESSONS[i-1].id];
function events(){const ev=[];allUnis().forEach(u=>{const x=S.unis[u.id];if(!x)return;[["open","Applications open"],["close","Application deadline"],["test","Entry test"],["merit","Merit list"],["fee","Fee deadline"]].forEach(([k,l])=>{if(x[k])ev.push({d:x[k],l,u:u.name,id:u.id,c:CONF[x.conf]})})});return ev.sort((a,b)=>a.d.localeCompare(b.d))}
function plan(){const d=S.p.daily;const m=Math.round(d*.4),p=Math.round(d*.25),t=Math.round(d*.2);return[["Mathematics lesson + quiz",m],["Programming / CS reading",p],["Entry-test practice",t],["Revision of weak topics",Math.max(5,d-m-p-t)]]}
function bar(p){return`<div class="bar"><i style="width:${Math.min(100,Math.round(p))}%"></i></div>`}

function render(){
const t=V.tab;let h="";
if(t==="home")h=home();else if(t==="learn")h=learn();else if(t==="adm")h=adm();else if(t==="prac")h=prac();else h=prof();
$("#app").innerHTML=h;
$("#nav").innerHTML=[["home","🏠","Home"],["learn","📚","Learn"],["adm","🎓","Admissions"],["prac","✏️","Practice"],["me","👤","Profile"]].map(x=>`<a href="#${x[0]}" class="${x[0]===t?"on":""}"><b>${x[1]}</b>${x[2]}</a>`).join("");
}
function go(t){V.tab=t;V.lesson=null;V.uni=null;V.track=null;V.q=null;if(location.hash!=="#"+t)location.hash=t;render();window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["home","learn","adm","prac","me"].includes(h)&&h!==V.tab){V.tab=h;V.lesson=V.uni=V.track=V.q=null;render()}});

function home(){
const nl=nextLesson(),pct=doneCount()/LESSONS.length*100,ev=events().filter(e=>e.d>=todayStr()).slice(0,3);
const chk=S.chk[todayStr()]||{};const pl=plan();
const tracked=allUnis().filter(u=>S.unis[u.id]&&S.unis[u.id].interest).length;
return`<p class="mu">${new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</p>
<h1>Welcome back 👋</h1><p class="mu">Today’s target: ${S.p.daily} minutes. Small steps, every day.</p>
<div class="card"><h3>What to do today</h3>${nl?`<p>Next lesson: <b>${esc(nl.t)}</b></p><button onclick="openLesson('${nl.id}')">Continue learning</button>`:`<p>You finished all lessons available in Phase 1. Revise, or use Practice.</p>`}
${pl.map((x,i)=>`<label class="c"><input type="checkbox" ${chk[i]?"checked":""} onchange="tick(${i},this.checked)">${x[0]} – ${x[1]} min</label>`).join("")}</div>
<div class="grid"><div class="card"><div class="mu">Study streak</div><h1>🔥 ${streak()}</h1></div><div class="card"><div class="mu">Total hours</div><h1>${(S.mins/60).toFixed(1)}</h1></div></div>
<div class="card"><div class="row"><h3>Course completion (Phase 1 lessons)</h3><b>${Math.round(pct)}%</b></div>${bar(pct)}</div>
<h2>Upcoming deadlines</h2>${ev.length?ev.map(e=>`<div class="card"><b>${esc(e.l)}</b> – ${esc(e.u)}<div class="mu">${e.d} · ${esc(e.c)}</div></div>`).join(""):`<div class="card mu">No dates recorded yet. Add dates from each university’s official site in Admissions.</div>`}
<h2>Areas</h2><div class="grid">
<div class="card" onclick="go('adm')"><h3>🎓 Admissions</h3><div class="mu">${tracked} interested</div></div>
<div class="card" onclick="go('learn')"><h3>➗ Mathematics</h3><div class="mu">${doneCount()}/${LESSONS.length} lessons</div></div>
${Object.keys(TRACKS).map(k=>`<div class="card" onclick="openTrack('${k}')"><h3>${TRACKS[k].i} ${TRACKS[k].n}</h3><div class="mu">Roadmap</div></div>`).join("")}
<div class="card" onclick="go('prac')"><h3>✏️ Test prep</h3><div class="mu">Mixed practice</div></div></div>`}
function tick(i,v){const t=todayStr();S.chk[t]=S.chk[t]||{};S.chk[t][i]=v;if(v)mark();save();render()}

function learn(){
if(V.lesson)return lessonView();
if(V.track)return trackView();
return`<h1>Learn</h1><p class="mu">Always in order. Pass each quiz to unlock the next lesson.</p>
<h2>➗ Mathematics – Level 1: Basic arithmetic</h2>
${LESSONS.map((l,i)=>{const d=S.done[l.id],u=unlocked(i);return`<div class="card ${u?"":"lk"}"><div class="row"><div><h3>${i+1}. ${esc(l.t)}</h3><span class="mu">${d?`Mastery ${d.best}%`:u?"Ready":"🔒 Complete the previous lesson"}</span></div><button class="${d?"g":""}" ${u?"":"disabled"} onclick="openLesson('${l.id}')">${d?"Review":"Start"}</button></div></div>`}).join("")}
<h2>Coming in later phases</h2><div class="card"><ul>${MATH_LATER.map(x=>`<li>${x}</li>`).join("")}</ul><div class="mu">These are not built yet. They are listed so you can see the full path.</div></div>
<h2>Other tracks</h2>${Object.keys(TRACKS).map(k=>`<div class="card row" onclick="openTrack('${k}')"><h3>${TRACKS[k].i} ${TRACKS[k].n}</h3><span class="mu">Roadmap ›</span></div>`).join("")}
<h2>Free resources</h2>${resList(MATHRES)}`}
function resList(r){return r.map(x=>`<div class="card"><a href="${x[1]}" target="_blank" rel="noopener">${esc(x[0])}</a><div class="mu">${esc(x[2])}</div></div>`).join("")}
function openTrack(k){V.tab="learn";V.track=k;V.lesson=null;render();window.scrollTo(0,0)}
function trackView(){const t=TRACKS[V.track];return`<button class="g" onclick="V.track=null;render()">‹ Back</button><h1>${t.i} ${t.n}</h1>
<div class="card"><div class="hl">Lessons for this track are not built yet (planned for a later phase). Start with Mathematics now: it is the foundation for this track.</div><ol>${t.st.map(x=>`<li>${x}</li>`).join("")}</ol></div><h2>Free resources</h2>${resList(t.res)}`}
function openLesson(id){V.tab="learn";V.track=null;V.lesson=id;V.q=null;render();window.scrollTo(0,0)}
function lessonView(){
const i=LESSONS.findIndex(l=>l.id===V.lesson),l=LESSONS[i];
let h=`<button class="g" onclick="V.lesson=null;render()">‹ Back</button><h1>${esc(l.t)}</h1>
<div class="card"><h3>Why it matters</h3><p>${esc(l.why)}</p><h3>Simple explanation</h3><p>${esc(l.s)}</p><h3>Like you are 10</h3><p>${esc(l.k)}</p><h3>Real-life example</h3><p>${esc(l.r)}</p><h3>Solved step by step</h3><div class="hl">${esc(l.w)}</div></div><h2>Quiz (pass: 2 of 3)</h2>`;
const R=V.q;
l.q.forEach((q,n)=>{h+=`<div class="card"><b>${n+1}. ${esc(q[0])}</b>${q[1].map((o,j)=>`<label class="opt c"><input type="radio" name="q${n}" value="${j}" ${R&&R.a[n]===j?"checked":""} ${R?"disabled":""}>${esc(o)}</label>`).join("")}${R?`<div class="${R.a[n]===q[2]?"ok":"bd"}">${R.a[n]===q[2]?"✔ Correct. ":"✘ Not quite. Correct answer: "+esc(q[1][q[2]])+". "}${esc(q[3])}</div>`:""}</div>`});
if(!R)h+=`<button onclick="submitQ()">Check answers</button>`;
else{const pass=R.s>=2;h+=`<div class="card"><h3>${R.s}/3 – ${pass?"Passed! 🎉":"Not passed yet"}</h3><p class="mu">${pass?"Lesson marked complete.":"Re-read the explanation above, then try again. Revision first, then the next lesson."}</p><div class="row"><button class="g" onclick="V.q=null;render();window.scrollTo(0,0)">Try again</button>${pass&&LESSONS[i+1]?`<button onclick="openLesson('${LESSONS[i+1].id}')">Next lesson ›</button>`:""}</div></div>`}
return h}
function submitQ(){const l=LESSONS.find(x=>x.id===V.lesson);const a=l.q.map((q,n)=>{const c=document.querySelector(`input[name=q${n}]:checked`);return c?+c.value:-1});if(a.includes(-1)){alert("Please answer all questions.");return}
const s=a.filter((x,n)=>x===l.q[n][2]).length;V.q={a,s};mark();
if(s>=2){const p=Math.round(s/3*100),old=S.done[l.id];S.done[l.id]={best:Math.max(p,old?old.best:0)};if(!old)S.mins+=10}
save();render();window.scrollTo(0,document.body.scrollHeight)}

function adm(){
if(V.uni)return uniView();
const f=(V.f||"").toLowerCase(),fs=V.fs==null?"":V.fs;
const list=allUnis().filter(u=>(u.name+u.city).toLowerCase().includes(f)&&(fs===""||String((S.unis[u.id]||{status:0}).status)===fs));
const ev=events().filter(e=>e.d>=todayStr());
return`<h1>Admissions</h1><div class="hl">Dates, fees and requirements are <b>not pre-filled</b>. Visit each official admissions site, then record what you find with a source and date. Statuses stay “Not announced” until you update them.</div>
<input placeholder="Search university or city" value="${esc(V.f||"")}" oninput="V.f=this.value;render();document.querySelector('input').focus()">
<select onchange="V.fs=this.value;render()"><option value="">All statuses</option>${STATUS.map((s,i)=>`<option value="${i}" ${fs===String(i)?"selected":""}>${s}</option>`).join("")}</select>
<h2>Calendar</h2>${ev.length?ev.map(e=>`<div class="card"><b>${e.d}</b> · ${esc(e.l)}<div class="mu">${esc(e.u)} · ${esc(e.c)}</div></div>`).join(""):`<div class="card mu">No upcoming dates recorded.</div>`}
<h2>Universities (${list.length})</h2>${list.map(u=>{const x=S.unis[u.id]||{status:0};return`<div class="card" onclick="V.uni='${u.id}';render();window.scrollTo(0,0)"><div class="row"><h3>${x.prio?"⭐ ":""}${esc(u.name)}</h3><span class="b">${STATUS[x.status||0]}</span></div><div class="mu">${esc(u.city)}${x.interest?" · Interested":""}${x.applied?" · Applied":""}</div></div>`}).join("")}
<h2>Add a university</h2><div class="card"><input id="nn" placeholder="Name"><input id="nc" placeholder="City"><input id="ns" placeholder="Website (https://…)"><button onclick="addUni()">Add</button></div>`}
function addUni(){const n=$("#nn").value.trim();if(!n)return alert("Enter a name.");let s=$("#ns").value.trim();if(s&&!/^https?:\/\//.test(s))s="https://"+s;S.custom.push({id:"c"+Date.now(),name:n,city:$("#nc").value.trim(),site:s,custom:true});save();render()}
function setU(f,v){U(V.uni)[f]=v;save()}
function uniView(){
const u=allUnis().find(x=>x.id===V.uni);if(!u){V.uni=null;return adm()}const x=U(u.id);
const dt=(k,l)=>`<label>${l}</label><input type="date" value="${esc(x[k])}" onchange="setU('${k}',this.value)">`;
const tx=(k,l,p)=>`<label>${l}</label><input value="${esc(x[k])}" placeholder="${p||""}" onchange="setU('${k}',this.value)">`;
const docs=DOCS.concat(x.extra);
return`<button class="g" onclick="V.uni=null;render()">‹ Back</button><h1>${esc(u.name)}</h1><p class="mu">${esc(u.city)}</p>
<div class="card">${u.site?`<a class="btn" href="${esc(u.site)}" target="_blank" rel="noopener">Open official website</a>`:`<span class="mu">No website added.</span>`}<p class="mu">Find the admissions page from the official site. This app never logs in for you and never stores passwords.</p></div>
<div class="card"><label class="c"><input type="checkbox" ${x.interest?"checked":""} onchange="setU('interest',this.checked)">Interested</label><label class="c"><input type="checkbox" ${x.prio?"checked":""} onchange="setU('prio',this.checked)">Priority</label><label class="c"><input type="checkbox" ${x.applied?"checked":""} onchange="setU('applied',this.checked)">I have applied</label>
${tx("appNo","Application number")}${tx("appFee","Application fee paid (Rs)")}</div>
<div class="card"><h3>Admission information</h3><label>Status</label><select onchange="setU('status',+this.value)">${STATUS.map((s,i)=>`<option value="${i}" ${x.status===i?"selected":""}>${s}</option>`).join("")}</select>
<label>How reliable is this information?</label><select onchange="setU('conf',+this.value)">${CONF.map((s,i)=>`<option value="${i}" ${x.conf===i?"selected":""}>${s}</option>`).join("")}</select>
${dt("open","Applications open")}${dt("close","Application deadline")}${dt("test","Entry test date")}${dt("merit","Merit list date")}${dt("fee","Fee submission deadline")}${dt("verified","Last verified on")}${tx("src","Source link","https://…")}</div>
<div class="card"><h3>Document checklist</h3>${docs.map((d,i)=>`<label class="c"><input type="checkbox" ${x.docs[d]?"checked":""} onchange="U('${u.id}').docs[${JSON.stringify(d).replace(/"/g,"&quot;")}]=this.checked;save()">${esc(d)}</label>`).join("")}
<input id="ex" placeholder="Add custom item"><button class="g" onclick="addDoc()">Add item</button></div>
<div class="card"><label>Notes</label><textarea rows="4" onchange="setU('notes',this.value)">${esc(x.notes)}</textarea></div>
${u.custom?`<button class="d" onclick="delUni()">Remove this university</button>`:""}`}
function addDoc(){const v=$("#ex").value.trim();if(v){U(V.uni).extra.push(v);save();render()}}
function delUni(){if(confirm("Remove this university and its notes?")){S.custom=S.custom.filter(c=>c.id!==V.uni);delete S.unis[V.uni];V.uni=null;save();render()}}

function prac(){
const pool=[];LESSONS.forEach(l=>{if(S.done[l.id])l.q.forEach(q=>pool.push(q))});
if(V.pr){const r=V.pr;if(r.done){return`<h1>Practice result</h1><div class="card"><h3>${r.s}/${r.qs.length}</h3>${r.qs.map((q,n)=>`<p class="${r.a[n]===q[2]?"ok":"bd"}">${n+1}. ${esc(q[0])}<br>${r.a[n]===q[2]?"✔":"✘ Correct: "+esc(q[1][q[2]])} – ${esc(q[3])}</p>`).join("")}<button onclick="V.pr=null;render()">Done</button></div>`}
return`<h1>Mixed practice</h1>${r.qs.map((q,n)=>`<div class="card"><b>${n+1}. ${esc(q[0])}</b>${q[1].map((o,j)=>`<label class="opt c"><input type="radio" name="p${n}" value="${j}">${esc(o)}</label>`).join("")}</div>`).join("")}<button onclick="subP()">Submit</button>`}
return`<h1>Practice</h1><div class="card"><h3>Mixed quiz from lessons you passed</h3><p class="mu">${pool.length?`${pool.length} questions available.`:"Pass a lesson first."}</p><button ${pool.length?"":"disabled"} onclick="startP()">Start (up to 6 questions)</button></div>
<div class="card"><h3>University entry tests</h3><p class="mu">NUST NET, FAST, COMSATS, Air, PIEAS and UET test profiles, timed mocks and a large question bank are planned for a later phase. Test patterns differ by university and year, so each profile will be editable and must be checked against the official site.</p></div>`}
function startP(){const pool=[];LESSONS.forEach(l=>{if(S.done[l.id])l.q.forEach(q=>pool.push(q))});V.pr={qs:pool.sort(()=>Math.random()-.5).slice(0,6),done:false};render()}
function subP(){const r=V.pr;const a=r.qs.map((q,n)=>{const c=document.querySelector(`input[name=p${n}]:checked`);return c?+c.value:-1});if(a.includes(-1))return alert("Please answer all questions.");r.a=a;r.s=a.filter((x,n)=>x===r.qs[n][2]).length;r.done=true;mark();S.mins+=5;save();render()}

function prof(){const p=S.p,lv=["Beginner","Some basics","Comfortable"];
const sel=(k,o)=>`<select onchange="S.p.${k}=this.value;save()">${o.map(v=>`<option ${p[k]===v?"selected":""}>${v}</option>`).join("")}</select>`;
return`<h1>Profile</h1><div class="card"><label>Target degree</label>${sel("degree",["BS Artificial Intelligence","BS Computer Science","BS Robotics","BS Mechatronics","BS Electrical Engineering","BS Software Engineering"])}
<label>Target admission year</label><input value="${esc(p.year)}" placeholder="e.g. 2027" onchange="S.p.year=this.value;save()">
<label>Entry test</label><input value="${esc(p.test)}" placeholder="e.g. NUST NET" onchange="S.p.test=this.value;save()">
<label>Maths level</label>${sel("mlevel",lv)}<label>Programming level</label>${sel("plevel",lv)}
<label>Daily study time</label><select onchange="S.p.daily=+this.value;save();render()">${[30,60,120,180].map(m=>`<option value="${m}" ${p.daily===m?"selected":""}>${m} minutes</option>`).join("")}</select>
<label>Study goals</label><textarea rows="3" onchange="S.p.goals=this.value;save()">${esc(p.goals)}</textarea></div>
<div class="card"><h3>Log study time</h3><div class="row"><input id="lm" type="number" min="1" placeholder="Minutes" style="width:50%"><button onclick="logM()">Add</button></div><p class="mu">Total: ${(S.mins/60).toFixed(1)} hours · Streak: ${streak()} days</p></div>
<div class="card"><label>Theme</label><select onchange="S.theme=this.value;save();applyTheme()"><option value="auto" ${S.theme==="auto"?"selected":""}>Automatic</option><option value="light" ${S.theme==="light"?"selected":""}>Light</option><option value="dark" ${S.theme==="dark"?"selected":""}>Dark</option></select></div>
<div class="card"><h3>Backup</h3><p class="mu">Your data lives only in this browser on this device. It does not sync to other devices, and clearing Safari data erases it. Export a backup regularly.</p><div class="row"><button onclick="exp()">Export JSON</button><label class="btn g" style="margin:0">Import<input type="file" accept="application/json" style="display:none" onchange="imp(this.files[0])"></label></div><br><button class="d" onclick="if(confirm('Erase all progress?')){localStorage.removeItem(K);S=load();applyTheme();render()}">Erase all data</button></div>`}
function logM(){const v=+$("#lm").value;if(v>0){S.mins+=v;mark();save();render()}}
function exp(){const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="ai-path-backup-"+todayStr()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(typeof d!=="object"||!d.p)throw 0;S=Object.assign(load(),d);save();applyTheme();render();alert("Backup restored.")}catch(e){alert("That file is not a valid backup.")}};r.readAsText(f)}

applyTheme();
{const h=location.hash.slice(1);if(["home","learn","adm","prac","me"].includes(h))V.tab=h}
render();
</script>
</body>
</html>
